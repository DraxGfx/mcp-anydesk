[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-anydesk-server"
version = "3.5.1"
description = "MCP server for remote Windows administration via AnyDesk keystroke injection and OCR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Diego" }]
keywords = ["mcp", "anydesk", "remote-administration", "ocr", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0",
    "pywin32>=306",
    "mss>=9.0",
    "pytesseract>=0.3",
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[project.scripts]
mcp-anydesk = "mcp_anydesk_server.__main__:main"

[project.urls]
# Repository = "https://github.com/YOUR_USERNAME/mcp-anydesk-server"

[tool.setuptools.packages.find]
include = ["mcp_anydesk_server*"]
